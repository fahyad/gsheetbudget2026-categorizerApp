<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Budget Categorizer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#FAFAF9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon.svg">
</head>
<body>
  <header>
    <h1>Categorizer <span class="version" id="header-version">—</span></h1>
    <div class="header-actions">
      <button id="settings-btn" title="Settings">Settings</button>
    </div>
  </header>

  <main id="view-root"></main>

  <nav id="tab-bar">
    <a href="#/categorize" class="tab">Categorize</a>
    <a href="#/dashboard" class="tab">Dashboard</a>
    <a href="#/setup" class="tab">Settings</a>
  </nav>

  <div id="error-toast" hidden></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
