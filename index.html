<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Budget Categorizer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#1a237e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon.svg">
</head>
<body>
  <header>
    <h1>Categorizer <span class="version">v0.4</span></h1>
    <div class="header-actions">
      <button id="refresh-btn" title="Refresh">Refresh</button>
      <button id="settings-btn" title="Settings">Settings</button>
    </div>
  </header>

  <main>
    <!-- Config / Setup screen -->
    <section id="config-section" hidden>
      <h2>Setup</h2>
      <p>Enter your Apps Script deployment URL and API key.</p>
      <form id="config-form">
        <label for="config-url">API URL</label>
        <input type="url" id="config-url" placeholder="https://script.google.com/.../exec" required>
        <label for="config-key">API Key</label>
        <input type="text" id="config-key" placeholder="Your API key" required>
        <button type="submit">Save</button>
      </form>
    </section>

    <!-- Main app -->
    <section id="app-section" hidden>
      <div id="transaction-list"></div>

      <div id="category-picker" hidden>
        <div id="category-picker-header">
          <span id="selected-merchant"></span>
          <button id="cancel-pick">Cancel</button>
        </div>
        <div id="category-buttons"></div>
        <button id="add-cat-btn" class="add-cat-trigger">+ Add Category</button>
      </div>

      <!-- Add Category modal -->
      <div id="add-cat-modal" hidden>
        <div class="modal-overlay"></div>
        <div class="modal-content">
          <h3>Add Category</h3>
          <label for="main-cat-select">Main Category</label>
          <select id="main-cat-select">
            <option value="" disabled selected>Select...</option>
          </select>
          <div id="new-main-group" hidden>
            <label for="new-main-input">New Main Category</label>
            <input type="text" id="new-main-input" placeholder="e.g. Savings">
          </div>
          <label for="sub-cat-input">Sub Category</label>
          <input type="text" id="sub-cat-input" placeholder="e.g. Dining Out">
          <div class="modal-actions">
            <button id="cancel-add-cat" type="button">Cancel</button>
            <button id="save-add-cat" type="button">Save</button>
          </div>
        </div>
      </div>
    </section>

    <div id="loading" hidden>
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>

    <div id="empty-state" hidden>
      <p>No pending transactions.</p>
      <button id="empty-refresh-btn">Refresh</button>
    </div>
  </main>

  <div id="undo-bar" hidden>
    <span id="undo-text"></span>
    <button id="undo-btn">UNDO</button>
  </div>

  <div id="error-toast" hidden></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
